        - standard
      - A:
          Pos: -1,0
        B:
          Pos: 0,0
        BondTypes:
        - standard
      - A:
          Pos: 0,-1
        B:
          Pos: 0,0
        BondTypes:
        - standard
      - A:
          Pos: 0,0
        B:
          Pos: 1,-1
        BondTypes:
        - standard
      - A:
          Pos: 0,0
        B:
          Pos: 0,1
        BondTypes:
        - standard
      - A:
          Pos: -1,1
        B:
          Pos: 0,0
        BondTypes:
        - standard