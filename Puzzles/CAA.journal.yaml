- Title: "Volume V, Issue III: Heterogeneous Alchemy"
  Description: "While most alchemists prefer their reagents to be as pure as possible, and elemental reagents are the gold standard, purifying substances to such a point can prove cumbersome and expensive. Though not often taken advantage of due to its apparent complexity, it is possible to utilize the transmutation engine itself to purify, sort, and distill substances into a more useful form, even when utilizing highly impure and mixed reagents. This issue contains a collection of such heterogenous alchemy processes that have proven useful over the years."
  Puzzles:
  - "caa-j3-dry-lubricant"
  - "caa-j3-aether-via-detector"
  - "caa-j3-metallic-residue"
  - "caa-j3-rose-gold"
  - "caa-j3-uranium-salt" 
- Title: "Volume V, Issue IV: In-Situ Alchemy"
  Description: "From farm fertilizers and pesticides made from a common component of mud, to netting on fishing vessels made from the algae present in the waters, alchemy is often most useful when it is right where it is needed. Though a humble farm will never be able to afford an alchemist, remaining aware of one's environment and what can be found in it often leads to significant savings in less readily available reagents. Moreover, the processes developed this way tend to end up in production cabinets installed in the very same location they were developed in years down the line."
  Puzzles:
  - "caa-j4-fertilizer-via-mud"
  - "caa-j4-algal-netting"
  - "c698519006942833" # illicit dis.
  - "c769866883196046" # emergency fuel
  - "c728737325226519" # Solar vapor
