- Title: "Volume V, Issue VI: Clandestine Alchemy"
  Description: "Though many of us prefer not to investigate further, there are alchemists that don't work entirely above board, and it is in these often unexplored corners of alchemical engineering that one can find many great processes and innovations that have yet to reach the rest of us. From particularly efficient processes put together in the most dire of circumstances, to production cabinets which avoid using something as common as the glyph of calcification to prevent detection, there is much for us to learn. In this issue you may find a small glimpse into this world, though for obvious reasons we will refrain from crediting the authors."
  Puzzles:
  - "c074779591894528" # Imperceptible Igniter
  - "c223474890170320" # Faux Ruby
  - "c870197525060516" # Everlasting Liquor
  - "c494033502433759" # Scrying Fiber
  - "c443633634664366" # Bistable Metal
- Title: "Volume V, Issue VII: Catalysts & Processes"
  Description: "Catalysts need no introduction, as even an alchemical engineer unconcerned with efficiency has many uses for them. What does need introduction however, is the idea of augmenting a transmutation engine to be able to utilize alchemical processes external to the engine itself, for example processes that may be too violent, complex to occur inside the engine, or simply haven't been turned into an easy to use glyph for one reason or another. Doing so is quite trivial using the same principles found in the conduits of every production cabinet, and there is much to gain by taking the time to exploit external reactions."
  Puzzles:
  - "caa-j7-induction-loop"  
  - "caa-j7-catalyzed-water"  
  - "caa-j7-blazing-crystal"
  - "caa-j7-porous-copper"  
  - "caa-j7-sednum-reduction"  
- Title: "Volume V, Issue VIII: Exotic Reagents On The Cheap"
  Description: "Many less fortunate alchemists are discouraged from exploring the latest and not so latest developments in alchemical science, often due to costly processes or the limited availability of certain costs and reagents. While this is unlikely to change, here we offer a collection of (relatively) inexpensive recipes to alleviate this issue somewhat and help prospective researchers explore the frontiers of alchemical science."
  Puzzles:  
  - "caa-j8-synthesis-via-triad"  
  - "caa-j8-volatile-sequence"  
  - "caa-j8-daylight-flare"  
  - "caa-j8-low-friction-filament"  
  - "caa-j8-aetheric-knot"  