Title: "Compendium of affordable alchemy" 
Chapters:
- Title: "Volume V, Issue I: Neglected Transmutations (Part I)"
  Description: "Often neglected ever since the advent of Duplication, cardinal transmutations are nonetheless useful in the modern age.\nEasily incorporated into most alchemical engines with minimal modification and providing lower-cost processes, convenient transformations, and resilience in environments Duplication may struggle in, these transmutations provide new possibilities to any alchemical engineer still willing to make use of them.\nIn this issue you may find a few such processes meant to help reignite even a skeptical alchemist's interest in these forgotten transmutations."
  Puzzles:
  - "caa-j1-alcohol-via-inversion-two"
  - "caa-j1-desiccant-gel"
  - "caa-j1-abrasive-gel-two"
  - "caa-j1-harmonious-brass"
  - "caa-j1-putrefaction-catalyst"
